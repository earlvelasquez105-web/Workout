<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Workout Tracker</title>
<style>
  :root {
    --bg: #062f33;
    --bg-2: #0b3d40;
    --card: #0f4c50;
    --card-2: #135b60;
    --accent: #7dd3c7;
    --accent-2: #a7f3d0;
    --text: #eefcfa;
    --muted: #c7e7e2;
    --danger: #ef4444;
    --shadow: rgba(0, 0, 0, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--text);
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 24px;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(6, 47, 51, 0.95);
    backdrop-filter: blur(8px);
    padding: 18px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .tab {
    border: 0;
    border-radius: 12px;
    padding: 10px;
    background: var(--card);
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active {
    background: var(--accent);
    color: #053235;
  }

  .screen {
    padding: 16px;
  }

  .hidden { display: none; }

  .card {
    background: rgba(15, 76, 80, 0.95);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 24px var(--shadow);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .card h2, .card h3, .card p {
    margin-top: 0;
  }

  .row {
    display: grid;
    gap: 10px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input, select, button {
    width: 100%;
    border-radius: 12px;
    border: none;
    padding: 12px 14px;
    font-size: 16px;
  }

  input, select {
    background: #edf9f7;
    color: #163739;
  }

  button.primary {
    background: var(--accent);
    color: #053235;
    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    background: var(--card-2);
    color: var(--text);
    cursor: pointer;
  }

  button.delete-btn {
    width: auto;
    padding: 8px 10px;
    background: var(--danger);
    color: white;
    font-size: 13px;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
  }

  .today-date {
    font-size: 14px;
    color: var(--accent-2);
    margin-top: 4px;
  }

  .exercise-list {
    display: grid;
    gap: 10px;
  }

  .exercise-item {
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }

  .exercise-main {
    min-width: 0;
  }

  .exercise-name {
    font-weight: 700;
    margin-bottom: 4px;
  }

  .exercise-sub {
    color: var(--muted);
    font-size: 13px;
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }

  .month-title {
    font-weight: 700;
    font-size: 18px;
  }

  .calendar-weekdays,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .weekday {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .day {
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 3px;
    cursor: pointer;
    font-weight: 700;
  }

  .day.empty {
    background: transparent;
    border: none;
    cursor: default;
  }

  .day.has-workout {
    border: 2px solid var(--accent);
  }

  .day.selected {
    background: var(--accent);
    color: #053235;
  }

  .day .tiny {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.85;
  }

  .split-pill {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(125, 211, 199, 0.18);
    color: var(--accent-2);
    font-size: 12px;
    font-weight: 700;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 16px 8px;
  }

  @media (max-width: 380px) {
    .screen { padding: 12px; }
    .card { padding: 12px; }
    .tab { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">Workout Tracker</div>
      <div class="subtitle">Simple iPhone-style training log</div>
      <div class="tabs">
        <button class="tab active" id="tab-today" type="button">Today</button>
        <button class="tab" id="tab-calendar" type="button">Calendar</button>
        <button class="tab" id="tab-progress" type="button">Progress</button>
      </div>
    </div>

    <div class="screen" id="screen-today">
      <div class="card">
        <h2 style="margin-bottom: 6px;">Start workout</h2>
        <div class="today-date" id="todayDateLabel"></div>
        <div class="row" style="margin-top: 12px;">
          <div>
            <label for="workoutType">Workout type</label>
            <select id="workoutType">
              <option value="Push">Push</option>
              <option value="Pull">Pull</option>
              <option value="Legs">Legs</option>
              <option value="Upper">Upper</option>
              <option value="Lower">Lower</option>
              <option value="Arms">Arms</option>
              <option value="Rest">Rest</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 10px;">Quick log</h3>
        <div class="row">
          <div>
            <label for="exercise">Exercise</label>
            <input id="exercise" list="exerciseSuggestions" placeholder="Bench Press" />
            <datalist id="exerciseSuggestions"></datalist>
            <div class="muted" id="lastUsedHint"></div>
          </div>
          <div>
            <label for="weight">Weight</label>
            <input id="weight" inputmode="decimal" placeholder="185" />
          </div>
          <div>
            <label for="reps">Reps</label>
            <input id="reps" inputmode="numeric" placeholder="8" />
          </div>
          <button class="primary" id="addExerciseBtn" type="button">Add Exercise</button>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div>
            <h3 style="margin-bottom:6px;">Today's exercises</h3>
            <div class="muted" id="todaySummary"></div>
          </div>
          <span class="split-pill" id="todaySplitBadge">Push</span>
        </div>
        <div class="exercise-list" id="todayList" style="margin-top:12px;"></div>
      </div>
    </div>

    <div class="screen hidden" id="screen-calendar">
      <div class="card">
        <div class="calendar-header">
          <button class="secondary" id="prevMonthBtn" type="button">←</button>
          <div class="month-title" id="monthTitle"></div>
          <button class="secondary" id="nextMonthBtn" type="button">→</button>
        </div>
        <div class="calendar-weekdays">
          <div class="weekday">Sun</div>
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:6px;" id="selectedDateTitle">Selected day</h3>
        <div class="muted" id="selectedDateType"></div>
        <div class="exercise-list" id="selectedDateList" style="margin-top:12px;"></div>
      </div>
    </div>

    <div class="screen hidden" id="screen-progress">
      <div class="card">
        <h3>Progress</h3>
        <p class="muted" style="margin-bottom: 0;">Charts can be added next. For now, this page shows your saved exercise count and total workout days.</p>
      </div>
      <div class="card">
        <div id="progressStats"></div>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'workoutTrackerV2';
  const MEMORY_KEY = 'workoutExerciseMemoryV2';

  const state = {
    workouts: JSON.parse(localStorage.getItem(STORAGE_KEY)) || {},
    exerciseMemory: JSON.parse(localStorage.getItem(MEMORY_KEY)) || [],
    today: new Date().toISOString().split('T')[0],
    selectedDate: new Date().toISOString().split('T')[0],
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    activeTab: 'today'
  };

  const workoutTypeEl = document.getElementById('workoutType');
  const exerciseEl = document.getElementById('exercise');
  const weightEl = document.getElementById('weight');
  const repsEl = document.getElementById('reps');
  const addExerciseBtn = document.getElementById('addExerciseBtn');
  const todayListEl = document.getElementById('todayList');
  const todaySummaryEl = document.getElementById('todaySummary');
  const todaySplitBadgeEl = document.getElementById('todaySplitBadge');
  const exerciseSuggestionsEl = document.getElementById('exerciseSuggestions');
  const lastUsedHintEl = document.getElementById('lastUsedHint');
  const todayDateLabelEl = document.getElementById('todayDateLabel');
  const calendarGridEl = document.getElementById('calendarGrid');
  const monthTitleEl = document.getElementById('monthTitle');
  const selectedDateTitleEl = document.getElementById('selectedDateTitle');
  const selectedDateTypeEl = document.getElementById('selectedDateType');
  const selectedDateListEl = document.getElementById('selectedDateList');
  const progressStatsEl = document.getElementById('progressStats');

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.workouts));
    localStorage.setItem(MEMORY_KEY, JSON.stringify(state.exerciseMemory));
  }

  function formatPrettyDate(dateString) {
    const date = new Date(dateString + 'T12:00:00');
    return date.toLocaleDateString(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });
  }

  function ensureDay(dateString) {
    if (!state.workouts[dateString]) {
      state.workouts[dateString] = {
        type: workoutTypeEl.value || 'Push',
        exercises: []
      };
    }
    if (!state.workouts[dateString].type) {
      state.workouts[dateString].type = workoutTypeEl.value || 'Push';
    }
    if (!Array.isArray(state.workouts[dateString].exercises)) {
      state.workouts[dateString].exercises = [];
    }
  }

  function getLastEntryForExercise(name) {
    const normalized = name.trim().toLowerCase();
    if (!normalized) return null;

    const dates = Object.keys(state.workouts).sort((a, b) => new Date(b) - new Date(a));
    for (const date of dates) {
      const day = state.workouts[date];
      if (!day || !Array.isArray(day.exercises)) continue;
      for (let i = day.exercises.length - 1; i >= 0; i--) {
        const entry = day.exercises[i];
        if ((entry.exercise || '').trim().toLowerCase() === normalized) {
          return { ...entry, date };
        }
      }
    }
    return null;
  }

  function updateExerciseSuggestions() {
    exerciseSuggestionsEl.innerHTML = '';
    state.exerciseMemory
      .slice()
      .sort((a, b) => a.localeCompare(b))
      .forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        exerciseSuggestionsEl.appendChild(option);
      });
  }

  function updateLastUsedHint() {
    const value = exerciseEl.value.trim();
    const last = getLastEntryForExercise(value);
    if (last) {
      lastUsedHintEl.textContent = `Last: ${last.weight || '-'} x ${last.reps || '-'} on ${last.date}`;
    } else {
      lastUsedHintEl.textContent = value ? 'No previous entry yet.' : '';
    }
  }

  function renderToday() {
    todayDateLabelEl.textContent = formatPrettyDate(state.today);
    ensureDay(state.today);

    const todayData = state.workouts[state.today];
    todayData.type = workoutTypeEl.value || todayData.type || 'Push';
    todaySplitBadgeEl.textContent = todayData.type;

    const count = todayData.exercises.length;
    todaySummaryEl.textContent = count === 0 ? 'No exercises logged yet.' : `${count} exercise${count === 1 ? '' : 's'} logged`;

    todayListEl.innerHTML = '';
    if (count === 0) {
      todayListEl.innerHTML = '<div class="empty-state">Add your first exercise for today.</div>';
      return;
    }

    todayData.exercises.forEach((entry, index) => {
      const row = document.createElement('div');
      row.className = 'exercise-item';
      row.innerHTML = `
        <div class="exercise-main">
          <div class="exercise-name">${entry.exercise}</div>
          <div class="exercise-sub">${entry.weight || '-'} lbs × ${entry.reps || '-'} reps</div>
        </div>
      `;

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => deleteExercise(state.today, index));
      row.appendChild(deleteBtn);
      todayListEl.appendChild(row);
    });
  }

  function renderCalendar() {
    const monthDate = new Date(state.viewYear, state.viewMonth, 1);
    monthTitleEl.textContent = monthDate.toLocaleDateString(undefined, {
      month: 'long',
      year: 'numeric'
    });

    calendarGridEl.innerHTML = '';
    const firstDay = new Date(state.viewYear, state.viewMonth, 1).getDay();
    const daysInMonth = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement('div');
      blank.className = 'day empty';
      calendarGridEl.appendChild(blank);
    }

    for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
      const dateString = `${state.viewYear}-${String(state.viewMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
      const dayBtn = document.createElement('button');
      dayBtn.type = 'button';
      dayBtn.className = 'day';
      if (dateString === state.selectedDate) dayBtn.classList.add('selected');
      if (state.workouts[dateString] && state.workouts[dateString].exercises.length > 0) dayBtn.classList.add('has-workout');

      const split = state.workouts[dateString]?.type || '';
      dayBtn.innerHTML = `<div>${dayNum}</div>${split ? `<div class="tiny">${split}</div>` : ''}`;
      dayBtn.addEventListener('click', () => {
        state.selectedDate = dateString;
        renderCalendar();
        renderSelectedDate();
      });
      calendarGridEl.appendChild(dayBtn);
    }
  }

  function renderSelectedDate() {
    selectedDateTitleEl.textContent = formatPrettyDate(state.selectedDate);
    const day = state.workouts[state.selectedDate];
    selectedDateTypeEl.textContent = day ? `Workout type: ${day.type}` : 'No workout saved for this day.';
    selectedDateListEl.innerHTML = '';

    if (!day || !day.exercises.length) {
      selectedDateListEl.innerHTML = '<div class="empty-state">No exercises logged for this date.</div>';
      return;
    }

    day.exercises.forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'exercise-item';
      row.innerHTML = `
        <div class="exercise-main">
          <div class="exercise-name">${entry.exercise}</div>
          <div class="exercise-sub">${entry.weight || '-'} lbs × ${entry.reps || '-'} reps</div>
        </div>
      `;
      selectedDateListEl.appendChild(row);
    });
  }

  function renderProgress() {
    const dates = Object.keys(state.workouts);
    let totalExercises = 0;
    const uniqueExercises = new Set();

    dates.forEach(date => {
      const day = state.workouts[date];
      if (!day || !Array.isArray(day.exercises)) return;
      totalExercises += day.exercises.length;
      day.exercises.forEach(entry => uniqueExercises.add(entry.exercise));
    });

    progressStatsEl.innerHTML = `
      <div class="exercise-item">
        <div class="exercise-main">
          <div class="exercise-name">Workout days</div>
          <div class="exercise-sub">${dates.filter(date => state.workouts[date]?.exercises?.length).length}</div>
        </div>
      </div>
      <div class="exercise-item">
        <div class="exercise-main">
          <div class="exercise-name">Logged exercises</div>
          <div class="exercise-sub">${totalExercises}</div>
        </div>
      </div>
      <div class="exercise-item">
        <div class="exercise-main">
          <div class="exercise-name">Saved exercise names</div>
          <div class="exercise-sub">${uniqueExercises.size}</div>
        </div>
      </div>
    `;
  }

  function renderAll() {
    renderToday();
    renderCalendar();
    renderSelectedDate();
    renderProgress();
    updateExerciseSuggestions();
    updateLastUsedHint();
  }

  function switchTab(tabName) {
    state.activeTab = tabName;
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(screen => screen.classList.add('hidden'));

    document.getElementById(`tab-${tabName}`).classList.add('active');
    document.getElementById(`screen-${tabName}`).classList.remove('hidden');
  }

  function addExercise() {
    const exercise = exerciseEl.value.trim();
    const weight = weightEl.value.trim();
    const reps = repsEl.value.trim();

    if (!exercise) return;

    ensureDay(state.today);
    state.workouts[state.today].type = workoutTypeEl.value;
    state.workouts[state.today].exercises.push({ exercise, weight, reps });

    if (!state.exerciseMemory.includes(exercise)) {
      state.exerciseMemory.push(exercise);
    }

    saveState();
    exerciseEl.value = '';
    weightEl.value = '';
    repsEl.value = '';
    renderAll();
    switchTab('today');
  }

  function deleteExercise(dateString, index) {
    const day = state.workouts[dateString];
    if (!day || !Array.isArray(day.exercises)) return;
    day.exercises.splice(index, 1);

    if (day.exercises.length === 0) {
      // Keep the day record so type stays visible only if user wants it later? Simpler to remove it.
      delete state.workouts[dateString];
      if (dateString === state.today) {
        ensureDay(state.today);
      }
    }

    saveState();
    renderAll();
  }

  workoutTypeEl.addEventListener('change', () => {
    ensureDay(state.today);
    state.workouts[state.today].type = workoutTypeEl.value;
    saveState();
    renderAll();
  });

  exerciseEl.addEventListener('input', updateLastUsedHint);
  addExerciseBtn.addEventListener('click', addExercise);

  document.getElementById('tab-today').addEventListener('click', () => switchTab('today'));
  document.getElementById('tab-calendar').addEventListener('click', () => switchTab('calendar'));
  document.getElementById('tab-progress').addEventListener('click', () => switchTab('progress'));

  document.getElementById('prevMonthBtn').addEventListener('click', () => {
    state.viewMonth -= 1;
    if (state.viewMonth < 0) {
      state.viewMonth = 11;
      state.viewYear -= 1;
    }
    renderCalendar();
  });

  document.getElementById('nextMonthBtn').addEventListener('click', () => {
    state.viewMonth += 1;
    if (state.viewMonth > 11) {
      state.viewMonth = 0;
      state.viewYear += 1;
    }
    renderCalendar();
  });

  ensureDay(state.today);
  if (state.workouts[state.today]?.type) {
    workoutTypeEl.value = state.workouts[state.today].type;
  }
  renderAll();
</script>
</body>
</html>
