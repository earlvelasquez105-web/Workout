<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#042f2e;
margin:0;
color:white;
}

.app{
max-width:420px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:18px;
font-size:22px;
font-weight:600;
text-align:center;
background:#064e3b;
}

.tabs{
display:flex;
background:#022c22;
}

.tab{
flex:1;
padding:14px;
text-align:center;
cursor:pointer;
}

.tab.active{
background:#065f46;
}

.screen{
padding:16px;
flex:1;
overflow-y:auto;
}

.card{
background:#064e3b;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
border-radius:6px;
border:none;
}

button{
margin-top:10px;
width:100%;
padding:12px;
background:#14b8a6;
border:none;
border-radius:8px;
font-weight:bold;
color:#022c22;
}

.exercise{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}

.day{
background:#064e3b;
padding:10px;
border-radius:6px;
text-align:center;
font-size:12px;
cursor:pointer;
}

.day.active{
background:#14b8a6;
color:#022c22;
font-weight:bold;
}

.day.workout{
border:2px solid #14b8a6;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<div class="app">

<div class="header">Workout Tracker</div>

<div class="tabs">
<div class="tab active" onclick="showTab('today')">Today</div>
<div class="tab" onclick="showTab('calendar')">Calendar</div>
<div class="tab" onclick="showTab('progress')">Progress</div>
</div>

<div class="screen" id="todayScreen">

<div class="card">
<select id="workoutType">
<option>Push</option>
<option>Pull</option>
<option>Legs</option>
<option>Upper</option>
<option>Lower</option>
<option>Arms</option>
<option>Rest</option>
</select>
</div>

<div class="card">
<input id="exercise" placeholder="Exercise">
<input id="weight" placeholder="Weight">
<input id="reps" placeholder="Reps">
<button onclick="addWorkout()">Add Exercise</button>
</div>

<div class="card">
<div id="todayList"></div>
</div>

</div>

<div class="screen" id="calendarScreen" style="display:none">
<div class="calendar" id="calendar"></div>
</div>

<div class="screen" id="progressScreen" style="display:none">
<div class="card">Charts coming soon 📈</div>
</div>

</div>

<script>

let workouts=JSON.parse(localStorage.getItem("workouts"))||{};

let exerciseMemory=JSON.parse(localStorage.getItem("exerciseMemory"))||[];

let today=new Date().toISOString().split('T')[0];

function save(){
localStorage.setItem("workouts",JSON.stringify(workouts));
localStorage.setItem("exerciseMemory",JSON.stringify(exerciseMemory));
}

function showTab(name){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

event.target.classList.add("active");

let screens=["todayScreen","calendarScreen","progressScreen"];

screens.forEach(s=>document.getElementById(s).style.display="none");

if(name==='today')document.getElementById("todayScreen").style.display="block";
if(name==='calendar')document.getElementById("calendarScreen").style.display="block";
if(name==='progress')document.getElementById("progressScreen").style.display="block";

}

function addWorkout(){

let exercise=document.getElementById("exercise").value;
let weight=document.getElementById("weight").value;
let reps=document.getElementById("reps").value;

if(exercise==="")return;

if(!workouts[today])workouts[today]=[];

workouts[today].push({exercise,weight,reps});

if(!exerciseMemory.includes(exercise))exerciseMemory.push(exercise);

save();

renderToday();
buildCalendar();

}

function renderToday(){

let list=document.getElementById("todayList");

list.innerHTML="";

if(!workouts[today])return;

workouts[today].forEach(w=>{

let div=document.createElement("div");

div.className="exercise";

let last="";

if(workouts[today].length>1){
last=`<div class='small'></div>`;
}

div.innerHTML=`
<span>${w.exercise} — ${w.weight} x ${w.reps}</span>
`;

list.appendChild(div);

});

}

function buildCalendar(){

let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

let days=new Date(y,m+1,0).getDate();

for(let i=1;i<=days;i++){

let date=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;

let d=document.createElement("div");

d.className="day";

d.innerText=i;

if(date===today)d.classList.add("active");

if(workouts[date])d.classList.add("workout");

cal.appendChild(d);

}

}

renderToday();
buildCalendar();

</script>

</body>
</html>
